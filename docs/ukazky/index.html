eft+12;if(px+t.offsetWidth>r.width)px-=t.offsetWidth+24;t.style.left=px+\"px\";t.style.top=(e.clientY-r.top+12)+\"px\"});\nhit.addEventListener(\"pointerleave\",()=>{t.hidden=true;xh.setAttribute(\"visibility\",\"hidden\")});\n})();\n<\/script>\n"},{"comp":"RadarChart","group":"Grafy","subtitle":"Radarový graf: profil hráča, max. 2 hráči, percentily","height":470,"body":"<style>\nbody{margin:0;padding:16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}\n.ch{position:relative;max-width:640px;padding:20px;background:var(--surface-raised);border-radius:var(--radius-lg)}\n.ch h3{margin:0}.ch .sub{margin:2px 0 12px;color:var(--ink-muted)}\n.ch svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;overflow:visible}\n.ax{fill:var(--ink-muted);font-size:12px}.gr{fill:none;stroke:var(--hairline)}.sp{stroke:var(--hairline)}\n.a1{fill:var(--chart-1);fill-opacity:.18;stroke:var(--chart-1);stroke-width:2;stroke-linejoin:round}\n.a2{fill:var(--chart-2);fill-opacity:.18;stroke:var(--chart-2);stroke-width:2;stroke-linejoin:round}\n.pt{stroke:var(--surface-raised);stroke-width:2}.pt:hover{r:7}\n.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin:12px 0 0;padding:0;list-style:none;color:var(--ink-muted)}\n.lg li{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:3px}\n.src{margin:8px 0 0;color:var(--ink-muted)}\n.tip{position:absolute;z-index:1;pointer-events:none;padding:8px 10px;background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);box-shadow:var(--shadow-float);white-space:nowrap}\n<\/style>\n<figure class=\"ch\" id=\"ch\" style=\"margin:0\">\n  <h3 class=\"headline\">Profil hráča<\/h3>\n  <p class=\"sub footnote\">Percentil medzi strednými záložníkmi ligy · 100 = najlepší<\/p>\n  <svg id=\"g\" role=\"img\" aria-labelledby=\"t5\"><title id=\"t5\">Radarový graf: porovnanie dvoch hráčov v šiestich ukazovateľoch<\/title><\/svg>\n  <ul class=\"lg footnote\">\n
