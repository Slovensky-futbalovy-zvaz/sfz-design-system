<!-- @dsCard group="Grafy" height=300 subtitle="Prstencový graf: jeden podiel s číslom v strede" -->
<style>
body{margin:0;padding:16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.ch{max-width:640px;padding:20px;background:var(--surface-raised);border-radius:var(--radius-lg);display:grid;gap:16px;grid-template-columns:1fr;align-items:center}
@media (min-width:480px){.ch{grid-template-columns:180px 1fr}}
.ch h3{margin:0}.ch .sub{margin:2px 0 0;color:var(--ink-muted)}
.ring{position:relative;width:180px;height:180px}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .n{font-variant-numeric:tabular-nums}
.tr{fill:none;stroke:var(--hairline);stroke-width:18}.v{fill:none;stroke:var(--chart-1);stroke-width:18;stroke-linecap:round}
dl{margin:12px 0 0;display:grid;gap:8px}dl div{display:flex;align-items:center;gap:8px}
dt{flex:1;color:var(--ink-muted)}dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px}
.src{margin:8px 0 0;color:var(--ink-muted)}
</style>
<figure class="ch" style="margin:0">
  <div class="ring">
    <svg viewBox="0 0 120 120" role="img" aria-label="87 % hráčov má platnú registráciu">
      <circle class="tr" cx="60" cy="60" r="50"/>
      <circle class="v" id="v" cx="60" cy="60" r="50"/>
    </svg>
    <div class="c"><span class="title-1 n">87 %</span><span class="caption-1" style="color:var(--ink-muted)">platných</span></div>
  </div>
  <div>
    <h3 class="headline">Hráči s platnou registráciou</h3>
    <p class="sub footnote">Stav k 11. 11. 2026</p>
    <dl class="subheadline">
      <div><span class="sw" style="background:var(--chart-1)"></span><dt>Platná registrácia</dt><dd>87 412</dd></div>
      <div><span class="sw" style="background:var(--hairline);box-shadow:inset 0 0 0 1px var(--border-strong)"></span><dt>Bez platnej registrácie</dt><dd>12 588</dd></div>
    </dl>
    <p class="src caption-1">Ilustračné údaje</p>
  </div>
</figure>
<script>
(()=>{const v=document.getElementById("v"),C=2*Math.PI*50,p=0.87;
// medzera 2 % pri okraji, aby zaoblený koniec neprekryl začiatok
v.setAttribute("stroke-dasharray",`${C*p-C*0.02} ${C}`);v.setAttribute("stroke-dashoffset",`${-C*0.01}`);})();
</script>
