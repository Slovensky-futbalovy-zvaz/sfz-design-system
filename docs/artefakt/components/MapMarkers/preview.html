<!-- @dsCard group="Mapy" height=460 subtitle="Body na mapovom podklade: kluby, ihriská, zhluky, detail" -->
<style>
body{margin:0;padding:16px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.ch{position:relative;max-width:640px;padding:20px;background:var(--surface-raised);border-radius:var(--radius-lg)}
.ch h3{margin:0}.ch .sub{margin:2px 0 12px;color:var(--ink-muted)}
.map{position:relative;border-radius:var(--radius-md);overflow:hidden;box-shadow:inset 0 0 0 1px var(--hairline)}
.map svg{display:block;width:100%;height:auto}
.land{fill:var(--map-land)}.water{fill:none;stroke:var(--map-water);stroke-width:12;stroke-linecap:round}.lake{fill:var(--map-water)}
.rc{fill:none;stroke:var(--hairline);stroke-linecap:round}.r{fill:none;stroke:var(--map-road);stroke-linecap:round}
.bd{fill:none;stroke:var(--map-boundary);stroke-dasharray:4 4}
.pl{fill:var(--ink-muted);font-size:11px;font-weight:500;stroke:var(--map-land);stroke-width:3;paint-order:stroke;stroke-linejoin:round}
.zoom{position:absolute;top:8px;right:8px;display:grid;background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--shadow-float);overflow:hidden}
.zoom button{width:36px;height:36px;border:0;background:none;color:var(--ink);font:600 18px var(--font-sans);cursor:pointer}
.zoom button+button{border-top:1px solid var(--hairline)}
.attr{position:absolute;right:6px;bottom:4px;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--ink-muted)}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px;margin:12px 0 0;padding:0;list-style:none;color:var(--ink-muted)}
.lg li{display:inline-flex;align-items:center;gap:6px}
.src{margin:8px 0 0;color:var(--ink-muted)}
.tip{position:absolute;z-index:2;pointer-events:none;padding:8px 10px;background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);box-shadow:var(--shadow-float);white-space:nowrap}
.k{fill:var(--chart-1);stroke:var(--surface);stroke-width:2}.ih{fill:var(--chart-2);stroke:var(--surface);stroke-width:2}
.k:hover,.ih:hover{stroke:var(--ink)}
.cl{fill:var(--chart-1);stroke:var(--surface);stroke-width:3}.clh{fill:var(--chart-1);fill-opacity:.2}
.cn{fill:var(--on-brand);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.sel{fill:var(--chart-1);stroke:var(--surface);stroke-width:3}.selh{fill:var(--chart-1);fill-opacity:.22}
.pop{position:absolute;width:220px;padding:12px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-float);transform:translate(-50%,calc(-100% - 18px))}
.pop::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--surface);transform:translateX(-50%) rotate(45deg)}
.pop p{margin:2px 0 8px;color:var(--ink-muted)}.pop a{color:var(--brand-blue-ink);font-weight:600;text-decoration:none}
</style>
<figure class="ch" id="ch" style="margin:0">
  <h3 class="headline">Kluby a ihriská v okolí</h3>
  <p class="sub footnote">ObFZ Horná Ves · kliknite na bod pre detail</p>
  <div class="map" id="map">
    <svg id="g" viewBox="0 0 600 360" role="img" aria-labelledby="t8"><title id="t8">Mapa s klubmi a ihriskami; dva zhluky so 7 a 12 miestami</title></svg>
    <div class="zoom"><button type="button" aria-label="Priblížiť">+</button><button type="button" aria-label="Oddialiť">−</button></div>
    <div class="pop" id="pop" style="left:57%;top:43%"><b class="subheadline" style="font-weight:600">TJ Družstevník Horná Ves</b><p class="footnote">Klub · 4 družstvá · tráva, 2 kabíny</p><a class="footnote" href="#">Detail klubu</a></div>
    <span class="attr caption-2">Schematický podklad</span>
  </div>
  <ul class="lg footnote">
    <li><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" style="fill:var(--chart-1)"/></svg>Klub</li>
    <li><svg width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" style="fill:var(--chart-2)"/></svg>Ihrisko bez klubu</li>
    <li><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="8" style="fill:var(--chart-1)"/></svg>Viac miest – priblížte</li>
  </ul>
  <p class="src caption-1">Ilustračné údaje</p>
</figure>
<script>
(()=>{
const PODKLAD=`<rect class="land" width="600" height="360"/><path class="water" d="M-10 252C80 232 140 282 230 252S380 192 460 222 560 262 610 242"/><ellipse class="lake" cx="520" cy="86" rx="40" ry="20"/><path class="rc" stroke-width="5" d="M90 -5L118 365M-5 300L605 322M452 -5C430 120 482 240 470 365"/><path class="r" stroke-width="3" d="M90 -5L118 365M-5 300L605 322M452 -5C430 120 482 240 470 365"/><path class="rc" stroke-width="9" d="M-5 120C120 130 200 100 300 110S480 140 605 120M300 -5C290 90 320 180 300 365"/><path class="r" stroke-width="7" d="M-5 120C120 130 200 100 300 110S480 140 605 120M300 -5C290 90 320 180 300 365"/><path class="bd" d="M210 0L190 90L220 170L240 260L200 360M220 170L380 160L470 170L600 190"/><text class="pl" x="312" y="100">Horná Ves</text><text class="pl" x="128" y="290">Dolany</text><text class="pl" x="486" y="160">Nové Pole</text><text class="pl" x="20" y="200">Lúky</text>`;
const K=[[150,150,"FK Lúky"],[250,200,"OŠK Dolné Pole"],[390,250,"TJ Slovan Breziny"],[520,300,"FC Nové Pole"],[60,60,"TJ Sokol Hôrka"]];
const I=[[200,60,"Ihrisko pri škole"],[430,90,"Multifunkčné ihrisko"],[330,320,"Ihrisko Pod lesom"]];
const C=[[90,250,7],[500,200,12]];
let s=PODKLAD;
C.forEach(([x,y,n])=>{const r=n>9?20:16;s+=`<circle class="clh" cx="${x}" cy="${y}" r="${r+6}"/><circle class="cl" cx="${x}" cy="${y}" r="${r}" data-t="${n} miest – priblížte"/><text class="cn" x="${x}" y="${y+4}" text-anchor="middle" pointer-events="none">${n}</text>`});
I.forEach(([x,y,n])=>{s+=`<rect class="ih" x="${x-6}" y="${y-6}" width="12" height="12" rx="3" data-t="<b>${n}</b><br>Ihrisko bez klubu"/>`});
K.forEach(([x,y,n])=>{s+=`<circle class="k" cx="${x}" cy="${y}" r="6" data-t="<b>${n}</b><br>Klub"/>`});
s+=`<circle class="selh" cx="342" cy="155" r="16"/><circle class="sel" cx="342" cy="155" r="9"/>`;
document.getElementById("g").insertAdjacentHTML("beforeend",s);
const ch=document.getElementById("ch"),t=document.createElement("div");t.className="tip footnote";t.hidden=true;ch.append(t);
ch.addEventListener("pointermove",e=>{const m=e.target.closest("[data-t]");if(!m){t.hidden=true;return}t.innerHTML=m.dataset.t;t.hidden=false;const r=ch.getBoundingClientRect();let px=e.clientX-r.left+12;if(px+t.offsetWidth>r.width)px-=t.offsetWidth+24;t.style.left=px+"px";t.style.top=(e.clientY-r.top+12)+"px"});
ch.addEventListener("pointerleave",()=>t.hidden=true);
})();
</script>
